name: Refresh Premier League Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Premier League data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["FOOTBALL_DATA_TOKEN"]
          headers = {"X-Auth-Token": token}

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          matches = fetch("https://api.football-data.org/v4/competitions/PL/matches")
          standings = fetch("https://api.football-data.org/v4/competitions/PL/standings")

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"matches": matches, "standings": standings},
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update Premier League data"
          git push
