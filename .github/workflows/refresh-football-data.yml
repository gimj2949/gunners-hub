name: Refresh Premier League Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Fetch Premier League data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ.get("FOOTBALL_DATA_TOKEN")
          if not token:
              raise RuntimeError("FOOTBALL_DATA_TOKEN secret is missing.")

          headers = {"X-Auth-Token": token}

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as e:
                  print(f"API request failed: HTTP {e.code}")
                  print(e.read().decode("utf-8", errors="replace"))
                  raise

          matches = fetch(
              "https://api.football-data.org/v4/competitions/PL/matches"
          )
          standings = fetch(
              "https://api.football-data.org/v4/competitions/PL/standings"
          )

          output = {"matches": matches, "standings": standings}

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Current directory:", os.getcwd())
          print("Files:", os.listdir("."))
          print("data.json exists:", os.path.exists("data.json"))
 
          print("data.json created successfully.")
          print(f"File size: {os.path.getsize('data.json')} bytes")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update Premier League data"
          git push
